name: Security Scan

on:
  push:
    branches: [ main, mvp-live ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit Security Scanner
        run: |
          pip install bandit
          bandit -r backend/app intelligence_engine/ -ll -ii || true

      - name: Run Safety Dependency Check
        run: |
          pip install safety
          safety check --ignore 70612 || true
