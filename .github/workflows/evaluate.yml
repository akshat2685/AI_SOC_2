name: SOC AI Evaluation Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Run nightly at 2:00 AM

jobs:
  evaluate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: soc
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements.memory.txt
        pip install -r backend/app/requirements.txt
        pip install -r intelligence_engine/requirements.txt
        pip install boto3 pytest pytest-asyncio pytest-cov httpx slowapi python-json-logger structlog alembic fpdf2 psycopg2-binary asyncpg prometheus-client PyJWT redis responses mock faker psutil


    - name: Wait for Postgres to be ready
      env:
        PGPASSWORD: changeme
      run: |
        for i in {1..30}; do
          if psql -h localhost -U soc -d soc -c '\l' >/dev/null 2>&1; then
            echo "Postgres ready"
            break
          fi
          echo "Waiting for Postgres..."
          sleep 1
        done
        if ! psql -h localhost -U soc -d soc -c '\l' >/dev/null 2>&1; then
          echo "Postgres did not become ready" >&2
          exit 1
        fi

    - name: Setup Database Roles and Users
      env:
        PGPASSWORD: changeme
      run: |
        psql -h localhost -U soc -d soc -c "CREATE ROLE root WITH SUPERUSER LOGIN PASSWORD 'changeme';" || true
        psql -h localhost -U soc -d soc -c "CREATE ROLE postgres WITH SUPERUSER LOGIN PASSWORD 'changeme';" || true
        psql -h localhost -U soc -d soc -c "CREATE ROLE soc_user WITH SUPERUSER LOGIN PASSWORD 'soc_password';" || true
        psql -h localhost -U soc -d soc -c "CREATE ROLE soc_test WITH SUPERUSER LOGIN PASSWORD 'soc_test';" || true
        psql -h localhost -U soc -d soc -c "CREATE DATABASE soc_db OWNER soc;" || true
        psql -h localhost -U soc -d soc -c "CREATE DATABASE soc_test OWNER soc;" || true
        psql -h localhost -U soc -d soc -c "CREATE DATABASE ai_soc OWNER soc;" || true

    - name: Set environment variables
      run: |
        echo "PYTHONPATH=${{ github.workspace }}:${{ github.workspace }}/backend:${{ github.workspace }}/intelligence_engine:${{ github.workspace }}/backend/app:${{ github.workspace }}/intelligence_engine/soar:${{ github.workspace }}/intelligence_engine/agents:${{ github.workspace }}/intelligence_engine/digital_twin" >> $GITHUB_ENV
        echo "DATABASE_URL=postgresql+asyncpg://soc:changeme@localhost:5432/soc" >> $GITHUB_ENV
        echo "POSTGRES_URL=postgresql+asyncpg://soc:changeme@localhost:5432/soc" >> $GITHUB_ENV
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'test_gemini_key' }}" >> $GITHUB_ENV

    - name: Run Evaluation Suite
      run: |
        python -c "import sys, pprint; pprint.pprint(sys.path)"
        python -m pytest -q tests/
        python -m pytest -q intelligence_engine/tests/
