name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements.memory.txt
          pip install -r backend/app/requirements.txt
          pip install -r intelligence_engine/requirements.txt
          pip install boto3 pytest pytest-asyncio pytest-cov httpx slowapi python-json-logger structlog alembic fpdf2 psycopg2-binary asyncpg prometheus-client PyJWT redis responses mock faker psutil opentelemetry-api opentelemetry-sdk



      - name: Run Pytest Suite
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/backend:${{ github.workspace }}/intelligence_engine:${{ github.workspace }}/backend/app"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_gemini_key' }}
          SOAR_API_KEY: ${{ secrets.SOAR_API_KEY || 'test_soar_key' }}
          SOAR_API_ENDPOINT: "https://api.test.example.com/v1/containment"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          EVENT_BUS_BACKEND: stub
          RATE_LIMIT_STORAGE_URI: memory://
        run: |
          python -m pytest --import-mode=importlib tests/ --cov=backend/app --cov=intelligence_engine --cov-report=xml
          python -m pytest --import-mode=importlib intelligence_engine/tests/ --cov=intelligence_engine --cov-append --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml


  cloud-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: shieldai-cluster

      - name: Build and Load Docker Images
        run: |
          docker build -t shieldai/backend:ci -f Dockerfile.backend-prod .
          docker build -t shieldai/frontend:ci ./frontend
          kind load docker-image shieldai/backend:ci --name shieldai-cluster
          kind load docker-image shieldai/frontend:ci --name shieldai-cluster

      - name: Run Smoke Test on Cluster
        run: |
          kubectl cluster-info
          
          # Create deployment and service for backend
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: backend-smoke-test
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: backend
            template:
              metadata:
                labels:
                  app: backend
              spec:
                containers:
                - name: backend
                  image: shieldai/backend:ci
                  imagePullPolicy: Never
                  env:
                  - name: DATABASE_URL
                    value: "sqlite+aiosqlite:///:memory:"
                  - name: GEMINI_API_KEY
                    value: "test"
                  - name: SOAR_API_KEY
                    value: "test"
                  - name: EVENT_BUS_BACKEND
                    value: "stub"
                  - name: RATE_LIMIT_STORAGE_URI
                    value: "memory://"
                  ports:
                  - containerPort: 8000
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: backend-smoke-test
          spec:
            selector:
              app: backend
            ports:
            - protocol: TCP
              port: 8000
              targetPort: 8000
          EOF
          
          # Wait for deployment to be available
          echo "Waiting for backend deployment to be available..."
          kubectl wait --for=condition=available deployment/backend-smoke-test --timeout=120s || \
            (kubectl get pods -o wide -A; kubectl describe deployment backend-smoke-test; kubectl logs -l app=backend --all-containers; exit 1)
          
          # Port-forward service and check health with retry loop
          echo "Port-forwarding backend service and checking health..."
          kubectl port-forward svc/backend-smoke-test 8000:8000 >/tmp/portforward.log 2>&1 &
          PF_PID=$!
          for i in {1..12}; do
            if curl -sSf http://127.0.0.1:8000/api/v1/health; then
              echo "backend reachable and healthy"
              break
            fi
            sleep 5
          done
          if ! curl -sSf http://127.0.0.1:8000/api/v1/health; then
            echo "backend not reachable, capturing diagnostics"
            kubectl get pods -o wide -A
            kubectl describe pod -l app=backend
            kubectl logs -l app=backend --all-containers --tail=200
            kill $PF_PID || true
            exit 1
          fi
          kill $PF_PID || true
